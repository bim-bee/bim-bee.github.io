<!doctype html>
<html lang="en" dir="ltr" data-i18n-document-title="page.plan.title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NC Nesting — Cutting Plan</title>
  <script src="scripts/i18n.js"></script>
  <link rel="stylesheet" href="styles/navbar.css">
  <link rel="stylesheet" href="styles/cutting-plan.css">
</head>
<body>
  <site-navbar data-root="../"></site-navbar>
  <main>
    <section class="panel load-error" id="loadError" role="alert" hidden></section>
    <header class="job-header">
      <div class="job-header-main">
        <a id="backLink" class="action-button no-print" data-navbar-back href="batch-result.html"><span class="back-arrow" aria-hidden="true">←</span> <span data-i18n="action.backBatch">Back to batch result</span></a>
        <h1 id="pageHeading" data-i18n="common.cutPlan">Cut Plan</h1>
        <div id="jobNames" class="job-meta job-names"></div>
        <div class="job-meta"><div id="jobSettings"></div></div>
      </div>
      <div class="actions no-print" data-navbar-actions><button type="button" data-terms-button data-i18n="action.terms">Terms of Use</button><button id="downloadCsv" disabled data-i18n="action.downloadCsv">Download CSV</button><button id="printPage" disabled data-i18n="action.printPage">Print Page</button><button id="printFullSet" disabled data-i18n="action.printFullSet">Print Full Set</button></div>
    </header>
    <section class="panel optimization-panel" id="optimizationPanel" hidden><h2 id="optimizationHeading" data-i18n="optimization.comparison">Optimization comparison</h2><div id="optimizationComparison"></div></section>
    <section class="panel"><h2 data-i18n="common.planSummary">Plan summary</h2><div class="summary-grid" id="summary"></div></section>
    <div class="source-summary-grid">
      <section class="panel source-summary-card stock-orders-card"><h2 data-i18n="common.stockOrders">Stock orders</h2><div id="stockOrders"></div></section>
      <section class="panel source-summary-card storage-retrievals-card"><h2 data-i18n="common.storageRetrievals">Storage retrievals</h2><div id="storageRetrieval"></div></section>
    </div>
    <section class="panel"><h2 data-i18n="common.cuttingLayouts">Cutting layouts</h2><div id="pieces"></div><div class="legend" id="legend" data-i18n-aria-label="common.cuttingPlanLegend" aria-label="Cutting-plan legend"></div></section>
    <section class="panel"><h2 data-i18n="common.wasteList">Waste list</h2><div class="table-wrap"><table id="wasteList" class="waste-table" dir="ltr"></table></div></section>
  </main>
  <script src="scripts/navbar.js"></script>
  <script src="scripts/config.js"></script>
  <script src="scripts/utilization.js"></script>
  <script src="scripts/cutting-geometry.js"></script>
  <script src="scripts/optimization-comparison.js"></script>
  <script src="scripts/greedy-plan-builder.js"></script>
  <script src="scripts/app-storage.js"></script>
  <script src="scripts/terms.js"></script>
  <script src="scripts/demo-data.js"></script>
  <script src="scripts/layout-grouper.js"></script>
  <script src="scripts/print-renderer.js"></script>
  <script src="scripts/cutting-plan.js"></script>
</body>
</html>
